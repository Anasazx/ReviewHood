name: Deploy TuniRate Backend

# The server (Azure VM) builds the Docker image itself and restarts the api container.
# All the logic lives in ~/bin/deploy-tunirate.sh on the server; the SSH key in
# VPS_SSH_KEY is only allowed to run that script.

on:
  push:
    branches:
      - master
  workflow_dispatch:   # "Run workflow" button in the Actions tab

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: azureuser
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: /home/azureuser/bin/deploy-tunirate.sh
