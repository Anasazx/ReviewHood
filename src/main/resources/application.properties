spring.application.name=TuniRate

spring.datasource.url=jdbc:postgresql://localhost:5432/tunirate

spring.datasource.username=postgres
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true




spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=/Users/anasaz/Dev/revision/TuniRate/uploads

#this is to limit pagination size
spring.data.web.pageable.max-page-size=30